<div class="app-shell">
  @if (menuOpen()) {
    <button class="sidebar-scrim" type="button" aria-label="Close navigation" (click)="closeMenu()"></button>
  }

  <aside class="sidebar" [class.sidebar--open]="menuOpen()" aria-label="Main navigation">
    <a class="brand" routerLink="/inventory" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M7 9.5 16 5l9 4.5v13L16 27l-9-4.5v-13Z" />
          <path d="m7.5 10 8.5 4.5 8.5-4.5M16 14.5V26" />
        </svg>
      </span>
      <span class="brand-copy">
        <strong>AssetFlow</strong>
        <span>IT Inventory</span>
      </span>
    </a>

    <div class="nav-caption">Workspace</div>
    <nav class="primary-nav">
      <a routerLink="/inventory" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
        </svg>
        <span>Overview &amp; Inventory</span>
      </a>
      <a routerLink="/assistant" routerLinkActive="nav-link--active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5h16v11H9l-5 3v-14Z" />
          <path d="M8 9.5h8M8 13h5" />
        </svg>
        <span>Asset Assistant</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="workspace-card">
        <span class="workspace-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 20V8l8-4 8 4v12H4Z" />
            <path d="M9 20v-6h6v6M8 9h.01M12 9h.01M16 9h.01" />
          </svg>
        </span>
        <span><strong>Operations</strong><small>Asset workspace</small></span>
        <span class="workspace-more" aria-hidden="true">···</span>
      </div>
      <div class="sidebar-footnote">
        <span class="status-dot"></span>
        <span>Inventory synced</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="mobile-header">
      <button class="icon-button mobile-menu-button" type="button" aria-label="Open navigation" (click)="menuOpen.set(true)">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <a class="mobile-brand" routerLink="/inventory">AssetFlow</a>
      <span class="mobile-status"><span class="status-dot"></span>Live</span>
    </header>
    <router-outlet />
  </main>
</div>
